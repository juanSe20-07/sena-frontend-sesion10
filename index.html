<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi lista de tareas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h1 class="text-center mb-4">Mi lista de tareas</h1>

                        <div class="input-group mb-3">
                            <input type="text" id="tareaInput" class="form-control" placeholder="Escribe una tarea">
                            <button id="agregarBtn" class="btn btn-primary">Agregar</button>
                        </div>

                        <input type="text" id="buscarInput" class="form-control mb-3" placeholder="Buscar tarea...">

                        <div id="loading" class="alert alert-info text-center">
                            Cargando tareas...
                        </div>

                        <p id="mensaje" class="text-center"></p>

                        <ul id="listaTareas" class="list-group"></ul>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
